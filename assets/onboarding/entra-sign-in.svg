<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title description">
  <title id="title">본인 UPN과 초기 암호로 로그인하는 입력 항목 예시</title>
  <desc id="description">문서 기반 설명용 예시이며 실제 로그인 화면이 아닙니다. 첫 화면에 본인 UPN을 입력하고 다음을 누른 뒤, 암호 화면에 별도 전달된 초기 암호를 입력하고 로그인합니다.</desc>
  <rect width="800" height="430" fill="#eef2f6"/>
  <g font-family="system-ui, sans-serif" fill="#172e47">
    <text x="24" y="32" font-size="17" font-weight="700">문서 기반 입력 항목 예시 · 실제 로그인 화면 아님</text>
    <rect x="24" y="58" width="345" height="342" rx="12" fill="#fff" stroke="#ccd8e4"/>
    <rect x="431" y="58" width="345" height="342" rx="12" fill="#fff" stroke="#ccd8e4"/>
    <text x="48" y="105" font-size="25" font-weight="700">1. Sign in</text>
    <text x="48" y="145" font-size="18">본인 UPN 전체</text>
    <rect x="48" y="161" width="297" height="57" rx="5" fill="#f7fafc" stroke="#91a7be"/>
    <text x="62" y="197" font-size="17">운영자가 발급한 UPN</text>
    <text x="48" y="257" font-size="17" fill="#52677b">평소 회사·개인 계정으로</text>
    <text x="48" y="283" font-size="17" fill="#52677b">대신 로그인하지 않습니다.</text>
    <rect x="212" y="327" width="133" height="43" rx="5" fill="#1263c8"/>
    <text x="278" y="355" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Next / 다음</text>
    <path d="M383 223h29m-9-9 9 9-9 9" fill="none" stroke="#007f78" stroke-width="4"/>
    <text x="455" y="105" font-size="25" font-weight="700">2. Enter password</text>
    <text x="455" y="145" font-size="18">별도 전달된 초기 암호</text>
    <rect x="455" y="161" width="297" height="57" rx="5" fill="#f7fafc" stroke="#91a7be"/>
    <text x="469" y="198" font-size="23" letter-spacing="3">••••••••••</text>
    <text x="455" y="257" font-size="17" fill="#52677b">암호는 본인이 입력합니다.</text>
    <text x="455" y="283" font-size="17" fill="#52677b">이 예시에는 실제 암호가 없습니다.</text>
    <rect x="559" y="327" width="193" height="43" rx="5" fill="#1263c8"/>
    <text x="655" y="355" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Sign in / 로그인</text>
  </g>
</svg>
