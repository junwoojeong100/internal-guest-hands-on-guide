<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title description">
  <title id="title">본인 QR 스캔과 Authenticator 테스트 승인 절차 예시</title>
  <desc id="description">Microsoft 공식 등록 절차를 설명하는 재구성 예시입니다. 실제 QR과 인증 코드는 없습니다. 본인 브라우저에 표시된 QR을 본인 휴대폰으로 스캔하고 다음을 누른 뒤 본인이 시작한 테스트 알림의 숫자를 확인하고 승인합니다.</desc>
  <rect width="800" height="470" fill="#eef2f6"/>
  <g font-family="system-ui, sans-serif" fill="#172e47">
    <text x="24" y="32" font-size="17" font-weight="700">공식 절차 재구성 예시 · 실제 QR·인증 코드 없음</text>
    <rect x="24" y="59" width="398" height="384" rx="12" fill="#fff" stroke="#ccd8e4"/>
    <text x="47" y="108" font-size="24" font-weight="700">본인 브라우저 · QR 스캔</text>
    <rect x="127" y="137" width="188" height="188" rx="10" fill="#e7edf4" stroke="#91a7be" stroke-dasharray="7 5"/>
    <text x="221" y="218" text-anchor="middle" font-size="26" font-weight="700">QR 생략</text>
    <text x="221" y="250" text-anchor="middle" font-size="17">실제 본인 화면 QR만 스캔</text>
    <rect x="267" y="369" width="130" height="43" rx="5" fill="#1263c8"/>
    <text x="332" y="397" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Next / 다음</text>
    <path d="M438 254h35m-10-10 10 10-10 10" fill="none" stroke="#007f78" stroke-width="4"/>
    <rect x="495" y="61" width="272" height="382" rx="27" fill="#fff" stroke="#91a7be" stroke-width="3"/>
    <rect x="580" y="76" width="100" height="8" rx="4" fill="#ccd8e4"/>
    <text x="632" y="122" text-anchor="middle" font-size="23" font-weight="700">본인 Authenticator</text>
    <text x="632" y="182" text-anchor="middle" font-size="20">내가 시작한 테스트인가요?</text>
    <rect x="519" y="211" width="224" height="100" rx="8" fill="#f0f6fe"/>
    <text x="632" y="252" text-anchor="middle" font-size="21" font-weight="700">브라우저 숫자 확인</text>
    <text x="632" y="284" text-anchor="middle" font-size="16">화면 안내에 맞춰 입력</text>
    <rect x="519" y="342" width="224" height="47" rx="7" fill="#007f78"/>
    <text x="632" y="373" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">승인</text>
    <text x="632" y="419" text-anchor="middle" font-size="16">요청하지 않은 알림은 거부</text>
  </g>
</svg>
