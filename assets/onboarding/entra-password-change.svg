<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="title description">
  <title id="title">첫 암호 변경의 세 입력 항목 예시</title>
  <desc id="description">문서 기반 설명용 예시이며 실제 로그인 화면이 아닙니다. 현재 암호에는 초기 암호를, 새 암호와 확인에는 본인이 정한 같은 새 암호를 입력합니다. 실제 화면의 버튼 이름은 다를 수 있습니다.</desc>
  <rect width="800" height="490" fill="#eef2f6"/>
  <g font-family="system-ui, sans-serif" fill="#172e47">
    <text x="24" y="32" font-size="17" font-weight="700">문서 기반 입력 항목 예시 · 실제 로그인 화면 아님</text>
    <rect x="110" y="56" width="580" height="413" rx="12" fill="#fff" stroke="#ccd8e4"/>
    <text x="140" y="105" font-size="28" font-weight="700">첫 암호 변경</text>
    <text x="140" y="144" font-size="18">현재 암호 / Current password</text>
    <rect x="140" y="155" width="520" height="48" rx="5" fill="#f7fafc" stroke="#91a7be"/>
    <text x="158" y="187" font-size="20">초기 암호 입력</text>
    <text x="140" y="234" font-size="18">새 암호 / New password</text>
    <rect x="140" y="245" width="520" height="48" rx="5" fill="#f7fafc" stroke="#91a7be"/>
    <text x="158" y="277" font-size="20">본인이 정한 새 암호 입력</text>
    <text x="140" y="324" font-size="18">새 암호 확인 / Confirm password</text>
    <rect x="140" y="335" width="520" height="48" rx="5" fill="#f7fafc" stroke="#91a7be"/>
    <text x="158" y="367" font-size="20">위와 동일한 새 암호 입력</text>
    <rect x="437" y="407" width="223" height="40" rx="5" fill="#1263c8"/>
    <text x="548" y="434" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">화면 안내에 따라 완료</text>
  </g>
</svg>
