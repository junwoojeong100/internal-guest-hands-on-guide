<svg xmlns="http://www.w3.org/2000/svg" width="800" height="455" viewBox="0 0 800 455" role="img" aria-labelledby="title description">
  <title id="title">개인 GitHub 계정으로 조직 초대를 수락하는 확인 항목 예시</title>
  <desc id="description">GitHub 공식 초대 절차를 재구성한 설명용 예시이며 실제 GitHub 화면이 아닙니다. 로그인한 개인 사용자명과 초대된 조직명을 확인한 뒤 실제 초대 화면의 Join 또는 Accept invitation을 선택합니다. 이 그림은 가입이나 Copilot 권한을 부여하지 않습니다.</desc>
  <rect width="800" height="455" fill="#eef2f6"/>
  <g font-family="system-ui, sans-serif" fill="#172e47">
    <text x="24" y="32" font-size="17" font-weight="700">공식 절차 재구성 예시 · 실제 GitHub 화면 아님</text>
    <rect x="60" y="56" width="680" height="370" rx="12" fill="#fff" stroke="#ccd8e4"/>
    <text x="93" y="108" font-size="28" font-weight="700">조직 초대 / Organization invitation</text>
    <text x="93" y="151" font-size="19" fill="#52677b">실제 초대 링크에서 아래 두 값을 확인하세요.</text>
    <rect x="93" y="177" width="614" height="58" rx="7" fill="#f0f6fe" stroke="#1263c8"/>
    <text x="110" y="214" font-size="22"><tspan font-weight="700">로그인 계정</tspan><tspan dx="22">본인 개인 GitHub 사용자명</tspan></text>
    <rect x="93" y="252" width="614" height="58" rx="7" fill="#f0f6fe" stroke="#1263c8"/>
    <text x="110" y="289" font-size="22"><tspan font-weight="700">초대된 조직</tspan><tspan dx="22">운영자가 안내한 조직명</tspan></text>
    <rect x="93" y="342" width="614" height="50" rx="7" fill="#1a7f37"/>
    <text x="400" y="375" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Join / Accept invitation · 초대 수락</text>
  </g>
</svg>
