name: Pages

# Every push builds the guide from src/ + assets/ with build.py.
# Only pushes to main are deployed to GitHub Pages; other branches just get the build check.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the single-file guide (build.py)
        run: |
          touch /tmp/committed.html
          if [ -f github-copilot-cli-codespaces.html ]; then
            cp github-copilot-cli-codespaces.html /tmp/committed.html
          fi
          python3 build.py
          if cmp -s /tmp/committed.html github-copilot-cli-codespaces.html; then
            echo "The committed HTML matches the fresh build."
          else
            echo "::warning title=Committed HTML is out of date::github-copilot-cli-codespaces.html differs from the build of src/. The site is deployed from the fresh build; run 'python3 build.py' locally and commit the result."
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp github-copilot-cli-codespaces.html _site/index.html
          cp github-copilot-cli-codespaces.html _site/github-copilot-cli-codespaces.html
          ls -l _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
